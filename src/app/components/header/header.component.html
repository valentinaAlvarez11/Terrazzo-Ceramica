<header class="header" [class.scrolled]="isScrolled">
  <div class="container header-content">
    <div class="logo" (click)="scrollToSection('hero')">
      <img src="assets/logo.png" alt="TERRAZZO Taller Cerámico" class="logo-image">
    </div>
    
    <nav class="nav" [class.menu-open]="isMenuOpen">
      <a (click)="scrollToSection('hero')" class="nav-link">Inicio</a>
      <a (click)="scrollToSection('about')" class="nav-link">Sobre Nosotros</a>
      <a (click)="scrollToSection('products')" class="nav-link">Productos</a>
      <a (click)="scrollToSection('contact')" class="nav-link">Contacto</a>
    </nav>
    
    <div class="header-icons">
      <button class="icon-btn" aria-label="Carrito">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18C5.9 18 5.01 18.9 5.01 20C5.01 21.1 5.9 22 7 22C8.1 22 9 21.1 9 20C9 18.9 8.1 18 7 18ZM1 2V4H3L6.6 11.59L5.25 14.04C5.09 14.32 5 14.65 5 15C5 16.1 5.9 17 7 17H19V15H7.42C7.28 15 7.17 14.89 7.17 14.75L7.2 14.63L8.1 13H15.55C16.3 13 16.96 12.59 17.3 11.97L20.88 5.48C20.96 5.34 21 5.17 21 5C21 4.45 20.55 4 20 4H5.21L4.27 2H1ZM17 18C15.9 18 15.01 18.9 15.01 20C15.01 21.1 15.9 22 17 22C18.1 22 19 21.1 19 20C19 18.9 18.1 18 17 18Z" fill="currentColor"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Búsqueda">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="currentColor"/>
        </svg>
      </button>
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span [class.active]="isMenuOpen"></span>
        <span [class.active]="isMenuOpen"></span>
        <span [class.active]="isMenuOpen"></span>
      </button>
    </div>
  </div>
</header>
